propose:
  description: >
    You are proposing the motion: {motion}.
    Come up with a clear argument in favor of the motion.
    Be very convicing
  expected_output: >
    Your clear argument in favor of the motion, in a concise manner
  agent: debater
  output_file: output/propose.md

oppose:  # <-- Asegúrate de que NO tenga espacios al principio
  description: >
    You are in opposition to the motion: {motion}.
    Come up with a clear argument against the motion.
    Be very convicing
  expected_output: >
    Your clear argument against the motion, in a concise manner.
  agent: debater
  output_file: output/oppose.md

decide: # <-- Cámbiale el nombre de 'reporting_task' a 'decide' para que coincida con crew.py
  description: >
    Review the arguments presented by the debaters and decide wich side is more convicing
  expected_output: >
    You decide which side is more convicing, and why.
  agent: judge
  output_file: output/decide.md